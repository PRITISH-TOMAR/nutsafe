services:
  collector:
    build:
      context: ../../collector
      dockerfile: ../tools/docker/Dockerfile.collector
    networks:
      - internal
    restart: unless-stopped

  service:
    build:
      context: ../..
      dockerfile: src/Dockerfile
    networks:
      - internal
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
    depends_on:
      - clickhouse
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.5
    networks:
      - internal
    volumes:
      - chdata:/var/lib/clickhouse
    restart: unless-stopped


  edge:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal
    volumes:
      - ../../edge/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  chdata:
  caddy_data:
  caddy_config: