receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  otlphttp:
    endpoint: "http://service:4319"
    tls:
      insecure: true
    compression: none
    headers:
      api-key: "dev-key-change-me"
  debug:
    verbosity: detailed   # remove this exporter once storage is wired

service:
    pipelines:
      traces:
        receivers: [otlp]
        exporters: [otlphttp, debug]
      metrics:  # Telegraf sends metrics via OTLP
        receivers: [otlp]
        exporters: [otlphttp, debug]
      logs: # OTel agents send logs
        receivers: [otlp]
        exporters: [otlphttp, debug]